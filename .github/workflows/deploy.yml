name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build --base-href=/cv/

      - name: Deploy to https://wandersonareis.github.io/cv
        env:
          DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          export GIT_SSH_COMMAND="ssh -i \"$HOME/.ssh/deploy_key\" -o IdentitiesOnly=yes"

          rm -rf /tmp/cv-site
          git clone --depth 1 --branch gh-pages git@github.com:wandersonareis/wandersonareis.github.io.git /tmp/cv-site

          rm -rf /tmp/cv-site/cv
          cp -r dist/resume/browser /tmp/cv-site/cv

          cd /tmp/cv-site
          git add -A
          git diff --cached --quiet || git commit -m "Deploy CV from wandersonareis/resume@${GITHUB_SHA::7}"
          git push origin gh-pages
